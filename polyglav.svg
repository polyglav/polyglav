<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" role="img" aria-label="A Replio terminal session">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="14" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <style>
      text { font-family: "SF Mono", Monaco, "Cascadia Code", monospace; font-size: 13.5px; }
      .ask { fill: #F80; }
      .bar { fill: #223; }
      .dim  { fill: #888; }
      .prompt { fill: #2DE; }
      .text { fill: #EEF; }
      .title { fill: #678; text-size: 12px; }
    </style>
  </defs>

  <g transform="translate(32, 32)" filter="url(#shadow)">
    <rect width="650" height="340" rx="8" fill="#223"/>
    <rect class="bar" width="650" height="32" rx="8"/>
  </g>
  <g transform="translate(32, 32)">
    <circle cx="20" cy="20" r="6" fill="#F55"/>
    <circle cx="40" cy="20" r="6" fill="#FB2"/>
    <circle cx="60" cy="20" r="6" fill="#2C4"/>
    <text class="title" x="320" y="22" text-anchor="middle">polyglav</text>

    <text class="dim" x="16" y="60"><tspan class="text" font-weight="bold">Polyglav v0.46.0</tspan> ~/finances:main</text>
    <text x="16" y="80"><tspan class="dim" font-style="italic">/help to list commands</tspan></text>
    <text x="16" y="100"><tspan class="dim">@ Read mode (ollama/gpt-oss:20b)</tspan></text>

    <text x="16" y="120"><tspan class="prompt">&gt; Hi Poly, please review this month's invoices and flag unusual charges</tspan></text>
    <text x="16" y="140"><tspan class="dim">↳ Call analyst</tspan></text>
    <text x="16" y="160"><tspan class="dim">✓ Worked: analyst 3.3s (1,204 tokens)</tspan></text>
    <text x="16" y="180"><tspan class="dim">← Read invoices/*.csv</tspan></text>
    <text x="16" y="200"><tspan class="dim">✓ Thought 0.9s</tspan></text>
    <text x="16" y="220"><tspan class="text">Something unusual found:</tspan></text>
    <text x="16" y="240"><tspan class="text">- One invoice missing a purchase order last month</tspan></text>
    <text x="16" y="260"><tspan class="ask">? Create one page summary? [Y/n]</tspan></text>
    <text x="16" y="280"><tspan class="dim">→ Created report.md</tspan></text>
    <text class="dim" x="16" y="300">✓ Done 7.8s (8,378 tokens)</text>

    <text x="16" y="320"><tspan class="text">_</tspan></text>
  </g>
</svg>
