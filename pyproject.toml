[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "polyglav"
version = "0.38.0"
description = "A lightweight agentic tooling core with API, CLI and REPL interfaces"
requires-python = ">=3.10"
authors = [{name = "Evgenij Myasnikov"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai", "ai-agents", "api", "assistant", "cli", "cloud", "local", "python", "repl"]

[project.scripts]
polyglav = "polyglav.main:main"

[project.urls]
Repository = "https://github.com/polyglav/polyglav"
Issues = "https://github.com/polyglav/polyglav/issues"
Changelog = "https://github.com/polyglav/polyglav/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src", "polyglav.plugins.bundled" = "plugins"}
packages = [
  "polyglav",
  "polyglav.providers",
  "polyglav.sessions",
  "polyglav.commands",
  "polyglav.tools",
  "polyglav.plugins",
  "polyglav.plugins.bundled",
  "polyglav.utils",
]

[tool.setuptools.package-data]
"polyglav" = ["*.json"]
"polyglav.plugins.bundled" = ["*/*.json", "*/src/*.py", "*/tests/*.py"]
