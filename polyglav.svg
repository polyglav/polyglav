<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-label="A Polyglav terminal session">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="14" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <style>
      .agent { fill: #e3b341; font-family: "SF Mono", Monaco, "Cascadia Code", monospace; font-size: 13.5px; }
      .bar { fill: #282A36; }
      .dim  { fill: #8b949e; font-family: "SF Mono", Monaco, "Cascadia Code", monospace; font-size: 13.5px; }
      .prompt { fill: #22d3ee; font-family: "SF Mono", Monaco, "Cascadia Code", monospace; font-size: 13.5px; }
      .text { fill: #e6edf3; font-family: "SF Mono", Monaco, "Cascadia Code", monospace; font-size: 13.5px; }
      .title { fill: #6e7681; font-family: "SF Mono", Monaco, "Cascadia Code", monospace; font-size: 12px; }
    </style>
  </defs>

  <g transform="translate(30, 30)" filter="url(#shadow)">
    <rect width="720" height="360" rx="8" fill="#282A36"/>
    <rect class="bar" width="720" height="32" rx="8"/>
  </g>
  <g transform="translate(30, 30)">
    <circle cx="20" cy="20" r="6" fill="#ff5f57"/>
    <circle cx="40" cy="20" r="6" fill="#febc2e"/>
    <circle cx="60" cy="20" r="6" fill="#28c840"/>
    <text class="title" x="350" y="22" text-anchor="middle">polyglav</text>

    <text class="dim" x="16" y="60">Polyglav /help for commands</text>
    <text x="16" y="80"><tspan class="prompt">&gt;&gt;&gt; </tspan><tspan class="text">Hi</tspan></text>
    <text x="16" y="100"><tspan class="dim">+ Thought 0.2s</tspan></text>

    <text x="16" y="120"><tspan class="agent">&lt;&lt;&lt; </tspan><tspan class="text">Hi there! 👋</tspan></text>
    <text x="16" y="140"><tspan class="text">I'm your agentic assistant. I can help you with things like:</tspan></text>
    <text x="16" y="180"><tspan class="text">- **Delegating tasks** - spawning specialized sub-agents for research or review</tspan></text>
    <text x="16" y="200"><tspan class="text">- **Exploring the codebase** - reading files, finding definitions, tracing behavior</tspan></text>
    <text x="16" y="220"><tspan class="text">- **Building and testing** - running tests, linters, and formatters</tspan></text>
    <text x="16" y="240"><tspan class="text">- **Making code changes** - editing files, using Git, and committing work</tspan></text>
    <text x="16" y="260"><tspan class="text">- **Web research** - looking up current information when needed</tspan></text>
    <text x="16" y="300"><tspan class="text">What would you like to work on today?</tspan></text>
    <text class="dim" x="16" y="320">(7.8s, 8,378 tokens)</text>

    <text x="16" y="340"><tspan class="prompt">&gt;&gt;&gt;</tspan></text>
    <text x="48" y="340"><tspan class="text">&#95;</tspan></text>
  </g>
</svg>
